---
layout: default
---

<article class="post">
  {% if page.cover %}
  <div style="max-width: 800px; margin: 0 auto 24px;">
    <img src="{{ page.cover | relative_url }}" alt="{{ page.title | escape }}" style="display: block; width: 100%; height: auto;">
  </div>
  {% endif %}

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
